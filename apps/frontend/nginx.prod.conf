# Production nginx: serves the built SPA and proxies /api to the backend.
# Adapted from .devcontainer/nginx.conf, but the static root replaces the Vite
# dev-server upstream, and /api targets the `app` service (compose DNS), not
# 127.0.0.1.

# Preserve an upstream (external tunnel/proxy/manager) forwarded host/proto when
# present, else fall back to this server's own. The backend derives the public
# base URL for phone-facing capture links from these (docs/tls-public-access.md).
map $http_x_forwarded_host $fwd_host {
    # $http_host, not $host: $host is the server NAME and drops a non-default
    # port, so an instance published on :8080 was forwarded as bare host and
    # every address the backend built pointed at port 80 (#282).
    default $http_host;
    ~.      $http_x_forwarded_host;
}
map $http_x_forwarded_proto $fwd_proto {
    default $scheme;
    ~.      $http_x_forwarded_proto;
}

# Public-path proxy for external plugins (#250). The routing answer for a
# /plugins/<id>/* request is cached briefly so the auth_request oracle costs
# one backend round-trip per plugin per TTL, not per call.
proxy_cache_path /var/cache/nginx/mk_pub levels=1 keys_zone=mk_pub_resolve:1m max_size=10m inactive=5m;

# The oracle answers either a full plugin URL (streamed to directly) or the
# literal `pipe` — the plugin is only reachable through the core (loopback
# base URL, e.g. a dev plugin on the host). The rewrite target for the piped
# form is precomputed here because `if` cannot branch on auth_request results
# (rewrite phase runs before the access phase).
map $request_uri $mk_pub_pipe_uri {
    ~^/plugins/(?<mk_pub_rest>.*)$  /api/external/pub/$mk_pub_rest;
    default                         /api/external/pub/;
}
map $mk_pub_target $mk_pub_upstream {
    pipe     http://app:3000$mk_pub_pipe_uri;
    default  $mk_pub_target;
}

server {
    # 80 is the canonical container port — a manager that finds the service on
    # the standard port needs no port configured, so none can leak into the
    # public URL it publishes (#208; the contract is docs/tls-public-access.md §2).
    # 8080 stays as a second listener purely for continuity: stacks deployed
    # before #208 route to it, and pulling a newer image must not strip their
    # route out from under them. Nothing in this repo targets it any more.
    listen 80 default_server;
    listen [::]:80 default_server;
    listen 8080;
    listen [::]:8080;
    server_name _;

    # Base64 file attachments (3D models, archives, code) far exceed nginx's 1 MB
    # default. Kept in step with the backend's express body limit (main.ts).
    client_max_body_size 64m;

    root /usr/share/nginx/html;
    index index.html;

    # NestJS backend API (also carries the socket.io upgrade at /api/socket.io).
    location /api/ {
        proxy_pass http://app:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $fwd_host;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        # Forward the real client IP so the backend's login throttle keys on it
        # (#237). $proxy_add_x_forwarded_for appends $remote_addr to any inbound
        # header; with the backend's bounded `trust proxy` it reads the entry
        # this proxy added, not a client-spoofed one. X-Real-IP is the single
        # immediate peer, for completeness.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache_bypass $http_upgrade;
        # socket.io upgrades and slow LLM-backed HTTP calls (vision completion)
        # can run past nginx's default 60s read timeout — raise it.
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # The pub-resolve oracle is subrequest-only: block the direct route the
    # /api/ prefix would otherwise open (it answers with container addresses).
    location = /api/external/pub-resolve {
        return 404;
    }

    # Internal face of the oracle, reachable only via auth_request below.
    location = /_mk_pub_resolve {
        internal;
        proxy_pass http://app:3000/api/external/pub-resolve;
        # The sub-request inherits the main request's method and body; the
        # oracle wants neither — a bare GET with the original URI in a header.
        proxy_method GET;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
        proxy_cache mk_pub_resolve;
        proxy_cache_key $request_uri;
        proxy_cache_valid 200 30s;
        proxy_cache_valid 403 10s;
    }

    # Web face of external plugins' declared public paths (#250): the reserved
    # /plugins/ prefix — no SPA route may claim it. The oracle both authorizes
    # (undeclared → 403 → 404) and targets; declared paths stream directly to
    # the plugin container, `pipe` answers re-enter /api/ toward the core's
    # byte pipe. Streaming responses honour X-Accel-Buffering: no.
    location /plugins/ {
        auth_request /_mk_pub_resolve;
        auth_request_set $mk_pub_target $upstream_http_x_mk_target;
        error_page 403 = @mk_pub_denied;
        # Compose project networks are user-defined, so Docker's embedded DNS
        # resolves service names; a variable proxy_pass needs it named.
        resolver 127.0.0.11 ipv6=off valid=30s;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $fwd_host;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_pass $mk_pub_upstream;
    }

    location @mk_pub_denied {
        return 404;
    }

    # SPA: serve the static build, fall back to index.html for client-side
    # routes (HTML5 history — e.g. /capture/:token, deep links).
    location / {
        try_files $uri $uri/ /index.html;
    }
}

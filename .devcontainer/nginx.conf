# Preserve an upstream (external tunnel/proxy) forwarded host/proto when present,
# otherwise fall back to this server's own host/scheme. The backend derives the
# public base URL for phone-facing capture links from these (docs/tls-public-access.md).
map $http_x_forwarded_host $fwd_host {
    # $http_host, not $host: $host is the server NAME and drops a non-default
    # port, so an instance published on :8080 was forwarded as bare host and
    # every address the backend built pointed at port 80 (#282).
    default $http_host;
    ~.      $http_x_forwarded_host;
}
map $http_x_forwarded_proto $fwd_proto {
    default $scheme;
    ~.      $http_x_forwarded_proto;
}

server {
    listen 8080 default_server;
    listen [::]:8080 default_server;

    server_name _;

    # Allow large request bodies — base64 file attachments (project files: 3D
    # models, archives, code) far exceed nginx's 1 MB default. Kept in step with
    # the backend's express body limit in apps/backend/src/main.ts.
    client_max_body_size 64m;

    # NestJS Backend API (also carries the socket.io upgrade at /api/socket.io)
    location /api/ {
        # host.docker.internal, not 127.0.0.1: nginx is a container on a
        # bridge network and the API is a process in the devcontainer, so
        # loopback here is nginx's own. The gateway alias comes from
        # `extra_hosts: host-gateway` in docker-compose.yml (#256).
        proxy_pass http://host.docker.internal:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $fwd_host;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_cache_bypass $http_upgrade;
        # This location also carries the socket.io upgrade (/api/socket.io) and
        # slow LLM-backed HTTP calls (e.g. the vision-completion capability),
        # which can run well past nginx's default 60s read timeout. Raise the
        # upstream timeouts so a long upgrade/request isn't dropped mid-flight.
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # Web face of external plugins' declared public paths (#250): /plugins/ is
    # reserved — no SPA route may claim it. In dev the core is `nx serve` in
    # the devcontainer rather than a container on this network, so every dev
    # plugin registers a published-port loopback base URL and the prod split
    # (auth_request + direct streaming, see apps/frontend/nginx.prod.conf) buys
    # nothing here: everything routes through the core's byte pipe, which
    # performs the same declaration checks.
    location /plugins/ {
        rewrite ^/plugins/(.*)$ /api/external/pub/$1 last;
    }

    # Subrequest-only oracle: not meaningful in dev, but keep the face
    # identical so a client probing it sees the same 404 as in prod.
    location = /api/external/pub-resolve {
        return 404;
    }

    # Vite Frontend Dev Server (serves the SPA; /capture/:token → index.html)
    location / {
        proxy_pass http://host.docker.internal:4200/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $fwd_host;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_cache_bypass $http_upgrade;
    }
}
